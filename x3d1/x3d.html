<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <title>營造法式 大木作制度</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

  <link rel="stylesheet" href="https://www.x3dom.org/download/dev/x3dom.css" />
  <script src="https://www.x3dom.org/download/dev/x3dom.js"></script>

  <style>
    body {
      font-family: Monospace;
      background-color: #72645b;
      margin: 0px;
      overflow: hidden;
    }

    #info {
      color: #fff;
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      z-index: 100;
      display: block;
    }

    a { color: skyblue; }

    x3d {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>

<body>
  <div id="info">
    營造法式 大木作制度
    <a xmlns:cc="http://creativecommons.org/ns#"
       href="https://myweb.ntut.edu.tw/~tjhsieh/"
       property="cc:attributionName"
       rel="cc:attributionURL">
      <img alt="創用 CC 授權條款" style="border-width:0" src="../CC-BY-NC-SA.svg" width="128"/>
    </a>
  </div>

  <x3d showStat="false" showLog="false">
    <scene>
      <background skyColor="0.447 0.392 0.357"></background>

      <fog color="0.447 0.392 0.357" visibilityRange="13"></fog>

      <navigationInfo type='"EXAMINE" "ANY"'
                      headlight="false"
                      reverseScroll="true">
      </navigationInfo>

      <viewpoint id="vp"
                 position="0 0 4"
                 centerOfRotation="0 0 0"
                 fieldOfView="0.6108"
                 description="主視角">
      </viewpoint>

      <ambientLight color="0.467 0.467 0.467" intensity="1"></ambientLight>
      <directionalLight direction="-1 -1 -1" color="1 1 1" intensity="1.35"></directionalLight>
      <directionalLight direction="-0.5 -1 1" color="1 0.667 0" intensity="1"></directionalLight>

      <transform translation="0 -1 0">
        <shape>
          <appearance>
            <material diffuseColor="0.6 0.6 0.6"
                      specularColor="0.063 0.063 0.063"
                      ambientIntensity="0.6"
                      shininess="0.1">
            </material>
          </appearance>
          <box size="40 0.01 40"></box>
        </shape>
      </transform>

      <transform DEF="modelRotation">
        <transform translation="0 0 0"
                   rotation="1 0 0 -1.5708"
                   scale="1 1 1">
            <inline id="modelInline"
                    url=""
                    nameSpaceName="model"
                    mapDEFToID="true">
            </inline>

        </transform>
      </transform>

      <timeSensor DEF="time"
                  cycleInterval="10"
                  loop="true"
                  enabled="true">
      </timeSensor>

      <orientationInterpolator DEF="rotator"
                               key="0 0.25 0.5 0.75 1"
                               keyValue="0 1 0 0,
                                         0 1 0 1.5708,
                                         0 1 0 3.1416,
                                         0 1 0 4.7124,
                                         0 1 0 6.2832">
      </orientationInterpolator>

      <ROUTE fromNode="time" fromField="fraction_changed"
             toNode="rotator" toField="set_fraction"></ROUTE>
      <ROUTE fromNode="rotator" fromField="value_changed"
             toNode="modelRotation" toField="rotation"></ROUTE>
    </scene>
  </x3d>

  <script>
    const MODEL_WHITELIST = [
      '01-1', '01-2',
      '02-1', '02-1-2', '02-1-3', '02-2', '02-3', '02-3-A', '02-4', '02-4-A', '02-5', '02-5-A', '02-6', '02-6-A',
      '03-1-1', '03-1-2', '03-2-1', '03-2-2', '03-2-3', '03-2-4', '03-3-1', '03-3-2', '03-4',
      '04-1', '04-2', '04-3',
      '05-1', '05-2', '05-3', '05-4', '05-5', '05-6',
      '06-1', '06-2',
      '07-1', '07-2',
      '08-1', '08-2',
      '09-1', '09-2',
      '10-1', '10-2', '10-3', '10-4', '10-5',
      '11',
      '12-1-1', '12-2',
      '13-1', '13-2', '13-3',
      '14-1', '14-2', '14-3',
      '15-1', '15-2',
      '16-1', '16-2',
      '17-1', '17-1-A',
      '18-1',
      '19-0', '19-1', '19-2', '19-3', '19-4', '19-5',
      '20-1-1', '20-1-2', '20-3', '20-3-A',
      '21',
      '22-1', '22-2', '22-3',
      '23',
      '24-1', '24-2', '24-3',
      '25-1', '25-2', '25-3',
      '26',
      '27-1', '27-2', '27-3', '27-4',
      '28-1', '28-2',
      '29-1', '29-2',
      '30',
      '31-1',
      '32',
      '34',
      '35',
      '36-1',
      '37',
      '38',
      '39',
      '40-1',
      '41',
      '42',
      '43-1', '43-2',
      '44-1', '44-2',
      '45-1', '45-2',
      '46-1', '46-2',
      '47-1', '47-2',
      '48-1', '48-2', '48-3',
      '49'
    ];

    const MODEL_BASE_PATH = './model/';
    const MODEL_EXTENSION = '.x3d';

    function getModelFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('model');
    }

    function isModelAllowed(modelName) {
      return MODEL_WHITELIST.includes(modelName);
    }

    function loadModel() {
      const modelName = getModelFromURL();

      if (!modelName) {
        console.warn('未指定模型參數。使用方式: ?model=模型名稱');
        document.getElementById('info').innerHTML += '<br><span style="color: #ffaa00;">提示：請使用 ?model=模型名稱 來指定要載入的模型</span>';
        return;
      }

      if (!isModelAllowed(modelName)) {
        console.error('拒絕載入：模型 "' + modelName + '" 不在白名單中');
        document.getElementById('info').innerHTML += '<br><span style="color: #ff6b6b;">錯誤：模型 "' + modelName + '" 不在允許的列表中</span>';
        return;
      }

      const modelPath = MODEL_BASE_PATH + modelName + MODEL_EXTENSION;
      const inlineElement = document.getElementById('modelInline');

      if (inlineElement) {
        inlineElement.setAttribute('url', modelPath);
        console.log('成功載入模型：' + modelPath);
      }
    }

    window.addEventListener('load', loadModel);
  </script>
</body>
</html>
